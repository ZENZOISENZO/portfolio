<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enzo Piquet — Film photographer & videographer based in Tokyo">
  <title>Enzo Piquet</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow-x: hidden; }

    .home-main {
      margin-left: 190px;
      display: flex;
      flex-direction: column;
    }

    /* ── Video ── */
    .home-video {
      width: 70%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }
    .home-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .home-video-placeholder {
      width: 100%;
      height: 100%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #999;
      letter-spacing: 0.05em;
    }

    /* ── Bio ── */
    .home-bio {
      padding: 80px 60px 140px;
      max-width: 640px;
    }
    .home-bio p {
      font-family: "Times New Roman", Times, serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.75;
      color: #000;
      margin: 0 0 1.4em;
    }
    .home-bio p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="site-name">Enzo Piquet</a>
    <nav class="sidebar-nav">
      <span class="nav-parent">work</span>
      <a href="photo.html" class="nav-sub">photo</a>
      <a href="video.html" class="nav-sub">video</a>
      <a href="contact.html" class="nav-contact">contact</a>
    </nav>
  </aside>

  <main class="home-main">

    <!-- Landing video -->
    <div class="home-video">
      <video autoplay muted loop playsinline>
        <source src="assets/video/HOME/BW%2016mm.mov" type="video/mp4">
      </video>
    </div>

    <!-- Bio -->
    <div class="home-bio">
      <p>French Photographer and videographer raised in Thailand and currently based in Tokyo. Founder of a creative production company working across photography and films.</p>
    </div>

  </main>

</body>
</html>
