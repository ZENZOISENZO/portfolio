<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enzo Piquet — Film photographer & videographer based in Tokyo">
  <title>Enzo Piquet</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow-x: hidden; }

    .home-main {
      margin-left: 190px;
      display: flex;
      flex-direction: column;
    }

    /* ── Portrait ── */
    .home-portrait {
      width: 70%;
    }
    .home-portrait img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Bio ── */
    .home-bio {
      padding: 60px 60px 140px;
      max-width: 640px;
    }
    .home-bio p {
      font-family: "Times New Roman", Times, serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.75;
      color: #000;
      margin: 0 0 1.4em;
    }
    .home-bio p:last-child { margin-bottom: 0; }

    @media (max-width: 768px) {
      .home-main { margin-left: 0; }
      .home-portrait { width: 100%; }
      .home-bio { padding: 40px 20px 80px; }
      .home-bio p { font-size: 14px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="site-name">Enzo Piquet</a>
    <nav class="sidebar-nav">
      <span class="nav-parent">work</span>
      <a href="photo.html" class="nav-sub">photo</a>
      <a href="video.html" class="nav-sub">video</a>
      <a href="contact.html" class="nav-contact">contact</a>
    </nav>
  </aside>

  <main class="home-main">

    <!-- Portrait -->
    <div class="home-portrait">
      <img src="assets/images/portrait/SaveClip.App_464864717_18251748013261301_8156044011587412282_n.jpg"
           alt="Enzo Piquet">
    </div>

    <!-- Bio -->
    <div class="home-bio">
      <p>French Photographer and videographer raised in Thailand and currently based in Tokyo. Founder of a creative production company working across photography and films.</p>
    </div>

  </main>

</body>
</html>
