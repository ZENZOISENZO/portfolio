<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact — Enzo Piquet">
  <title>Contact — Enzo Piquet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ─── Navigation ─────────────────────── -->
  <nav>
    <a href="index.html" class="nav-logo">Enzo Piquet</a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="work.html">
          <span data-en>Work</span>
          <span data-jp>作品</span>
        </a>
        <a href="about.html">
          <span data-en>About</span>
          <span data-jp>について</span>
        </a>
        <a href="contact.html">
          <span data-en>Contact</span>
          <span data-jp>連絡</span>
        </a>
      </div>
      <div class="lang-toggle">
        <button data-lang="en">EN</button>
        <span class="divider">/</span>
        <button data-lang="jp">JP</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="contact-wrap">
      <div class="contact-inner">

        <h1 class="contact-heading">
          <span data-en>Let's make<br><em>something together.</em></span>
          <span data-jp>一緒に<br><em>何かを作りましょう。</em></span>
        </h1>

        <!-- Email -->
        <p class="contact-label" data-en>Email</p>
        <p class="contact-label" data-jp>メール</p>
        <!--
          Replace your@email.com with your actual email address
        -->
        <a href="mailto:your@email.com" class="contact-email">your@email.com</a>

        <!-- Social -->
        <p class="contact-socials-label" data-en>Follow</p>
        <p class="contact-socials-label" data-jp>フォロー</p>
        <div class="contact-socials">
          <!--
            Replace # with your actual URLs
          -->
          <a href="#" target="_blank" rel="noopener">Instagram</a>
          <a href="#" target="_blank" rel="noopener">Vimeo</a>
          <!--
            Optional: add more as needed
            <a href="#" target="_blank" rel="noopener">Behance</a>
          -->
        </div>

        <!-- Location -->
        <p class="contact-location">
          <span data-en>Based in Tokyo, Japan — Available worldwide</span>
          <span data-jp>東京在住 — 世界中での撮影対応可</span>
        </p>

      </div>
    </div>
  </main>

  <!-- ─── Footer ─────────────────────────── -->
  <footer>
    <span>© 2025 Enzo Piquet</span>
    <span data-en>Tokyo, Japan</span>
    <span data-jp>東京、日本</span>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
