<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="About — Enzo Piquet">
  <title>About — Enzo Piquet</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ── Base ── */
    body {
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 190px; height: 100vh;
      padding: 30px 28px;
      z-index: 10;
      background: #fff;
    }
    .site-name {
      display: block;
      font-size: 15px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 28px; line-height: 1.2; color: #000;
    }
    .sidebar-nav { display: flex; flex-direction: column; }
    .nav-parent {
      font-size: 12px; font-weight: 700;
      line-height: 2.15; display: block;
      color: #000; letter-spacing: 0.01em;
    }
    .nav-sub {
      display: block; font-weight: 400;
      font-size: 12px; line-height: 2.15;
      padding-left: 16px; color: #000;
      letter-spacing: 0.01em; transition: opacity 0.15s;
    }
    .nav-sub:hover { opacity: 0.4; }
    .nav-contact {
      font-size: 12px; font-weight: 700;
      line-height: 2.15; display: block;
      color: #000; letter-spacing: 0.01em;
      transition: opacity 0.15s; margin-top: 4px;
    }
    .nav-contact:hover, .nav-contact.active { opacity: 0.4; }

    /* ── Main ── */
    main {
      margin-left: 190px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Layout: photo left, info right ── */
    .about-layout {
      display: flex;
      gap: 60px;
      align-items: center;
    }

    /* ── Portrait ── */
    .about-photo img {
      width: 240px;
      height: auto;
      display: block;
    }

    /* ── Info ── */
    .about-info {
      padding-top: 4px;
    }
    .about-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .about-line {
      font-size: 12px;
      font-weight: 400;
      line-height: 2;
      color: #000;
    }
    .about-line a:hover { opacity: 0.5; }

    @media (max-width: 768px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 18px 20px 12px;
        display: flex;
        align-items: baseline;
        gap: 20px;
        border-bottom: 1px solid #e8e8e8;
      }
      .site-name { font-size: 13px; margin-bottom: 0; flex-shrink: 0; }
      .sidebar-nav { flex-direction: row; align-items: baseline; flex-wrap: wrap; }
      .nav-parent { display: none; }
      .nav-sub { padding-left: 0; margin-right: 14px; line-height: 1.6; }
      .nav-contact { margin-top: 0; }
      main { min-height: calc(100vh - 60px); }
      .about-layout { flex-direction: column; gap: 30px; align-items: flex-start; padding: 0 20px; }
      .about-photo img { width: 160px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="site-name">Enzo Piquet</a>
    <nav class="sidebar-nav">
      <span class="nav-parent">work</span>
      <a href="photo.html" class="nav-sub">photo</a>
      <a href="video.html" class="nav-sub">video</a>
      <a href="contact.html" class="nav-contact active">contact</a>
    </nav>
  </aside>

  <main>
    <div class="about-layout">

      <!-- Portrait -->
      <div class="about-photo">
        <img src="assets/images/portrait/SaveClip.App_464864717_18251748013261301_8156044011587412282_n.jpg"
             alt="Enzo Piquet">
      </div>

      <!-- Info -->
      <div class="about-info">
        <div class="about-name">Enzo Piquet</div>
        <div class="about-line">+66 07090200972</div>
        <div class="about-line"><a href="mailto:enzopiquet93@gmail.com">enzopiquet93@gmail.com</a></div>
        <div class="about-line"><a href="https://instagram.com/zenzopics" target="_blank">Instagram: @zenzopics</a></div>
      </div>

    </div>
  </main>

</body>
</html>
